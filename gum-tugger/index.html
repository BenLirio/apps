<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Source+Serif+4:wght@400;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
  <header class="hud">
    <div class="brand">GUM TUGGER</div>
    <div class="meta">
      <span class="pulls" id="pullsLabel">PULL 1 / 3</span>
      <span class="best" id="bestLabel">BEST: 0.0 cm</span>
    </div>
  </header>

  <div class="stage" id="stage">
    <canvas id="cv" aria-label="Strand of pink gum stretches from above to your finger"></canvas>
    <div class="hint" id="hint">touch &amp; drag downward — don't snap it</div>
    <div class="readout" id="readout">0.0 cm</div>
  </div>

  <section class="result-card" id="resultCard" hidden aria-live="polite">
    <div class="rc-stamp">CHEWING ARCHETYPE</div>
    <div class="rc-name" id="rcName">— —</div>
    <div class="rc-line" id="rcLine">— —</div>
    <hr class="rc-rule">
    <div class="rc-row"><span class="rc-key">PULL 1</span><span class="rc-val" id="rc1">—</span></div>
    <div class="rc-row"><span class="rc-key">PULL 2</span><span class="rc-val" id="rc2">—</span></div>
    <div class="rc-row"><span class="rc-key">PULL 3</span><span class="rc-val" id="rc3">—</span></div>
    <hr class="rc-rule">
    <div class="rc-row total"><span class="rc-key">LONGEST</span><span class="rc-val" id="rcLongest">—</span></div>
    <div class="rc-foot" id="rcFoot">artificial elongation, certified by no one</div>
  </section>

  <div class="share-row" id="shareRow" hidden>
    <button id="btnShare" type="button" onclick="share()">share verdict</button>
    <button id="btnAgain" type="button" onclick="restart()">three new pulls</button>
  </div>

  <section class="ghost-note" id="ghostNote" hidden>
    <span class="g-dot"></span>
    <span id="ghostText">a friend's stretch is haunting your strand</span>
  </section>

  <footer class="legal">
    <small>no dentists were consulted. no gum was harmed (it's photons).</small>
  </footer>
</div>

<script type="module" src="app.js"></script>
<script src="feedback.js" defer></script>
</body>
</html>
