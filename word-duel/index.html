<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Word Duel</title>
  <meta property="og:title" content="Word Duel">
  <meta property="og:description" content="Race a friend to build the longest word. 12 letters, 90 seconds, one winner.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://benlirio.com/word-duel/">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
  <script src="feedback.js" defer></script>
</head>
<body>

<div id="screen-landing" class="screen">
  <h1>WORD DUEL</h1>
  <p class="tagline">12 letters. 90 seconds. One word. No mercy.</p>
  <input id="player-name" type="text" placeholder="your name" maxlength="20" autocomplete="off" autocapitalize="off">
  <div class="btn-row">
    <button class="btn-primary" onclick="createRoom()">Create Room</button>
  </div>
  <div class="join-row">
    <input id="join-code" type="text" placeholder="room code" maxlength="6" autocomplete="off"
           oninput="this.value=this.value.toUpperCase()">
    <button class="btn-secondary" onclick="joinRoom()">Join</button>
  </div>
  <p id="error-msg" class="error" style="display:none"></p>
</div>

<div id="screen-waiting" class="screen" style="display:none">
  <p class="label">your room code</p>
  <h2 id="room-code-display" class="room-code"></h2>
  <p class="waiting-copy">Waiting for your opponent to crack the code...</p>
  <small>Share this code — they pick "Join"</small>
</div>

<div id="screen-game" class="screen" style="display:none">
  <div class="game-header">
    <span id="timer-display" class="timer">1:30</span>
    <span id="vs-label" class="vs-label"></span>
  </div>
  <div id="letters-display" class="letters"></div>
  <p class="game-instruction">Build the longest word you can from these letters</p>
  <input id="word-input" type="text" placeholder="type your word here" maxlength="12" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" oninput="onWordInput()">
  <p id="word-status" class="word-status">&nbsp;</p>
  <button id="lock-btn" class="btn-primary" onclick="lockIn()" disabled>Lock In</button>
  <p id="lock-status" class="lock-status">&nbsp;</p>
</div>

<div id="screen-result" class="screen" style="display:none">
  <h2 id="result-headline" class="result-headline"></h2>
  <div id="result-cards" class="result-cards"></div>
  <p id="result-detail" class="result-detail"></p>
  <button class="btn-primary" onclick="shareChallenge()">Challenge a Friend</button>
  <button class="btn-secondary" onclick="location.reload()">Play Again</button>
</div>

</body>
</html>
