<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Critter Cauldron — Build a Tiny World</title>
  <meta property="og:title" content="Critter Cauldron — Build a Tiny World">
  <meta property="og:description" content="Pick whimsical creatures, twist the universe knobs, and watch a tiny made-up ecosystem bubble away in your browser.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://benlirio.com/apps/ecosystem-collapse-diorama/">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Fredoka:wght@400;600&family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
  <script src="feedback.js" defer></script>
</head>
<body>
  <div id="app">
    <header id="hud">
      <div id="hud-left">
        <span id="clock">DAY 1</span>
        <span id="weather-label">SUN</span>
      </div>
      <div id="hud-center">
        <span id="app-title">CRITTER CAULDRON</span>
      </div>
      <div id="hud-right">
        <span id="pop-counts"></span>
      </div>
    </header>

    <div id="canvas-wrap">
      <canvas id="world"></canvas>

      <button id="open-builder" title="Open the world builder">★ Build a World</button>

      <aside id="foodweb-panel" class="open" aria-label="Food web">
        <div class="fw-header">
          <span class="fw-title">FOOD WEB</span>
          <button id="fw-toggle" type="button" title="Hide food web" aria-label="Toggle food web">−</button>
        </div>
        <div id="foodweb-body" class="fw-body"></div>
      </aside>

      <div id="report-overlay" style="display:none">
        <div id="report-card">
          <div id="report-stamp">FIELD GAZETTE</div>
          <div id="report-time"></div>
          <div id="report-title"></div>
          <div id="report-body"></div>
          <button id="report-dismiss">keep watching →</button>
        </div>
      </div>

      <!-- Builder panel -->
      <div id="builder-overlay">
        <div id="builder-panel" role="dialog" aria-labelledby="builder-title">
          <div id="builder-stamp">★ WORLD BUILDER ★</div>
          <h2 id="builder-title">Mix your own ecosystem</h2>
          <p class="builder-hint">Pick which critters to release, then twist the universe knobs.</p>

          <div class="builder-section">
            <div class="builder-label">Critters in this world</div>
            <div id="critter-catalog"></div>
          </div>

          <div class="builder-section">
            <div class="builder-label">Universe knobs</div>
            <div id="universe-knobs">
              <label class="knob">
                <span class="knob-name">Plant abundance</span>
                <input type="range" id="knob-plants" min="0.3" max="2.5" step="0.1" value="1">
                <span class="knob-val" id="knob-plants-val">1.0×</span>
              </label>
              <label class="knob">
                <span class="knob-name">Day/Night speed</span>
                <input type="range" id="knob-day" min="0.3" max="3" step="0.1" value="1">
                <span class="knob-val" id="knob-day-val">1.0×</span>
              </label>
              <label class="knob">
                <span class="knob-name">Weather chaos</span>
                <input type="range" id="knob-weather" min="0" max="2" step="0.1" value="1">
                <span class="knob-val" id="knob-weather-val">1.0×</span>
              </label>
              <label class="knob">
                <span class="knob-name">Metabolism</span>
                <input type="range" id="knob-metabolism" min="0.4" max="1.8" step="0.1" value="1">
                <span class="knob-val" id="knob-metabolism-val">1.0×</span>
              </label>
              <label class="knob">
                <span class="knob-name">Fertility</span>
                <input type="range" id="knob-fertility" min="0.4" max="2" step="0.1" value="1">
                <span class="knob-val" id="knob-fertility-val">1.0×</span>
              </label>
              <label class="knob">
                <span class="knob-name">World vibe</span>
                <select id="knob-vibe">
                  <option value="meadow">Sun Meadow</option>
                  <option value="reef">Coral Reef</option>
                  <option value="dusk">Neon Dusk</option>
                  <option value="frost">Frost Garden</option>
                  <option value="lava">Ember Lands</option>
                  <option value="dream">Dream Static</option>
                </select>
              </label>
            </div>
          </div>

          <div id="builder-actions">
            <button id="builder-randomize">🎲 Surprise Me</button>
            <button id="builder-cancel">Close</button>
            <button id="builder-launch" class="primary">★ Launch World ★</button>
          </div>
        </div>
      </div>
    </div>

    <footer id="controls">
      <button id="btn-builder" title="Open world builder">★ Build</button>
      <button id="btn-reset" title="Restart with current world">↺ Restart</button>
      <label id="speed-wrap">
        <span>Speed</span>
        <input type="range" id="speed-slider" min="0.5" max="3" step="0.5" value="1">
        <span id="speed-val">1×</span>
      </label>
      <button id="btn-snapshot" title="Save snapshot">📷 Snap</button>
    </footer>

    <div id="share" style="display:none">
      <button onclick="share()">Share!</button>
    </div>
  </div>
</body>
</html>
