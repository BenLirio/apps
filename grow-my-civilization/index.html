<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grow My Civilization</title>
  <meta property="og:title" content="Grow My Civilization">
  <meta property="og:description" content="An illuminated chronicle. Spend Stability and Ambition through three crises a chapter. Pick your legacy goal — endure, ascend, or burn brilliantly.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://benlirio.com/apps/grow-my-civilization/">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
  <script src="feedback.js" defer></script>
</head>
<body>
  <div id="app">

    <!-- Single canvas used for both setup preview and main game -->
    <div id="canvas-wrap">
      <canvas id="canvas" width="360" height="300"></canvas>
    </div>

    <!-- ── SETUP PANEL ─────────────────────────────────────────────── -->
    <div id="setup-panel">
      <div id="header">
        <h1><span class="drop">G</span>row My Civilization</h1>
        <p id="header-sub">An illuminated chronicle.<br>Spend stability. Spend ambition. Choose your legacy.</p>
      </div>

      <div id="setup-form">
        <p class="naming-intro">Your civilization shall be named</p>
        <div id="civ-name-display"></div>
        <div class="btn-row">
          <button id="reroll-btn" type="button">↻ Roll Again</button>
        </div>

        <p class="naming-intro" style="margin-top: 18px;">Choose its legacy</p>
        <div id="goal-picker"></div>

        <button id="start-btn">Begin the Chronicle</button>
      </div>
    </div>

    <!-- ── GAME PANEL ──────────────────────────────────────────────── -->
    <div id="game-panel" style="display:none">
      <div id="game-header">
        <div id="civ-title-row">
          <span id="civ-title"></span>
          <span id="age-badge"></span>
        </div>
        <div id="era-label"></div>
        <div id="goal-laurel" style="display:none"></div>
      </div>

      <div id="resource-bars">
        <div class="resource">
          <div class="resource-row">
            <span class="resource-label">Stability</span>
            <span class="resource-value" id="stab-value">60</span>
          </div>
          <div class="resource-track" id="stability-bar">
            <div class="resource-fill stability-fill" id="stability-fill" style="width:60%"></div>
          </div>
        </div>
        <div class="resource">
          <div class="resource-row">
            <span class="resource-label">Ambition</span>
            <span class="resource-value" id="amb-value">40</span>
          </div>
          <div class="resource-track" id="ambition-bar">
            <div class="resource-fill ambition-fill" id="ambition-fill" style="width:40%"></div>
          </div>
        </div>
      </div>

      <!-- Persistent decision panel. Inner state toggles between thinking and ready. -->
      <div id="decision-panel" style="display:none">
        <div id="decision-era-tag">Chapter</div>
        <div id="story-so-far"></div>
        <div id="decision-body">
          <div id="decision-thinking">
            <div id="thinking-dots">consulting the oracles<span class="dots"></span></div>
          </div>
          <div id="decision-ready" style="display:none">
            <div id="crises-instructions">Three crises face you. Tap one to engage; the rest will fester.</div>
            <div id="crises-list"></div>
            <div id="resolution-line"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- ── VERDICT PANEL ───────────────────────────────────────────── -->
    <div id="verdict-panel" style="display:none">
      <div id="verdict-title"></div>
      <div id="verdict-civ-name"></div>
      <div id="verdict-goal-line"></div>
      <div id="verdict-decisions-label">Your Chronicle</div>
      <div id="verdict-decisions"></div>
      <div id="verdict-stats"></div>
    </div>

    <div id="share" style="display:none">
      <button onclick="share()">Share Your Chronicle</button>
      <button id="play-again-btn" class="secondary-btn">Begin Anew</button>
    </div>

  </div>
</body>
</html>
