<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grow My Civilization</title>
  <meta property="og:title" content="Grow My Civilization">
  <meta property="og:description" content="Name your civilization. Steer it through impossible choices. How long can it last before it collapses?">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://benlirio.com/apps/grow-my-civilization/">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
  <script src="feedback.js" defer></script>
</head>
<body>
  <div id="app">

    <!-- Single canvas used for both setup preview and main game -->
    <div id="canvas-wrap">
      <canvas id="canvas" width="360" height="300"></canvas>
    </div>

    <!-- ── SETUP PANEL ─────────────────────────────────────────────── -->
    <div id="setup-panel">
      <div id="header">
        <h1>GROW MY<br>CIVILIZATION</h1>
        <p id="header-sub">Every choice helps or hurts. How long can yours last?</p>
      </div>

      <div id="setup-form">
        <label class="field-label" for="civ-name-input">CIVILIZATION NAME</label>
        <input id="civ-name-input" type="text" maxlength="24" placeholder="e.g. The Iron Shore" autocomplete="off" spellcheck="false">

        <div id="setup-error"></div>
        <button id="start-btn" disabled>BEGIN ►</button>
      </div>
    </div>

    <!-- ── GAME PANEL ──────────────────────────────────────────────── -->
    <div id="game-panel" style="display:none">
      <div id="game-header">
        <div id="civ-title-row">
          <span id="civ-title"></span>
          <span id="age-badge"></span>
        </div>
        <div id="era-label"></div>
      </div>

      <div id="stats-bar">
        <div class="stat"><span class="stat-label">POP</span><span id="stat-pop">1</span></div>
        <div class="stat"><span class="stat-label">FOOD</span><span id="stat-food">—</span></div>
        <div class="stat"><span class="stat-label">ORDER</span><span id="stat-order">—</span></div>
        <div class="stat"><span class="stat-label">TECH</span><span id="stat-tech">—</span></div>
        <div class="stat"><span class="stat-label">TURNS</span><span id="stat-turns">0</span></div>
      </div>

      <!-- Decision panel (shown at each turn) -->
      <div id="decision-panel" style="display:none">
        <div id="decision-era-tag">A CROSSROADS</div>
        <div id="decision-event"></div>
        <div id="decision-choices"></div>
        <div id="decision-flavor"></div>
      </div>

      <!-- Loading overlay while AI fetches next question -->
      <div id="thinking-panel" style="display:none">
        <div id="thinking-dots">CONSULTING ORACLES<span class="dots"></span></div>
      </div>
    </div>

    <!-- ── VERDICT PANEL ───────────────────────────────────────────── -->
    <div id="verdict-panel" style="display:none">
      <div id="verdict-title"></div>
      <div id="verdict-civ-name"></div>
      <div id="verdict-decisions-label">YOUR CHRONICLE</div>
      <div id="verdict-decisions"></div>
      <div id="verdict-stats"></div>
    </div>

    <div id="share" style="display:none">
      <button onclick="share()">Share your civilization's story</button>
      <button id="play-again-btn" class="secondary-btn">Play Again</button>
    </div>

  </div>
</body>
</html>
