<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Ministry of Minor Regrets — Daily Audit</title>
  <meta property="og:title" content="Ministry of Minor Regrets">
  <meta property="og:description" content="Submit your mundane daily numbers. Receive an itemized audit of your regrets, stamped by the Ministry.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://benlirio.com/apps/ministry-of-minor-regrets/">
  <link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=IBM+Plex+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
  <script src="feedback.js" defer></script>
  <link rel="icon" type="image/jpeg" href="favicon.jpg">
  <link rel="apple-touch-icon" href="favicon.jpg">
  <meta property="og:image" content="https://benlirio.com/apps/ministry-of-minor-regrets/favicon.jpg">
</head>
<body>
  <main id="app">
    <section id="intake" class="form-card stepper-card">
      <header class="stepper-header">
        <div class="seal-row">
          <div class="seal seal-top">
            <span class="seal-inner">MINISTRY<br>OF MINOR<br>REGRETS</span>
          </div>
          <div class="form-meta">
            <div class="meta-row"><span>FORM</span><span>MR-17/B</span></div>
            <div class="meta-row"><span>SECTION</span><span>DAILY AUDIT</span></div>
            <div class="meta-row"><span>REV.</span><span>2026-05</span></div>
          </div>
        </div>
        <div class="step-status">
          <div class="step-counter" id="step-counter">DECLARATION 01 / 05</div>
          <div class="step-progress" id="step-progress" aria-hidden="true"></div>
        </div>
      </header>

      <div class="step-card" id="step-card" role="group" aria-label="current declaration">
        <!-- per-step content injected here -->
      </div>

      <div class="step-foot">
        <div class="cumulative" id="cumulative">RUNNING TOTAL: 0 REGRET</div>
        <div class="error-line" id="error-line" aria-live="polite"></div>
        <div class="step-buttons">
          <button id="back-btn" type="button" class="step-back" disabled>&larr; BACK</button>
          <button id="next-btn" type="button" class="step-next">FILE &amp; CONTINUE &rarr;</button>
        </div>
        <p class="disclaimer">Submission constitutes consent to regret quantification.</p>
      </div>
    </section>

    <section id="loading" class="loading-card" hidden>
      <div class="loading-label">ASSESSMENT IN PROGRESS</div>
      <div id="loading-msg" class="loading-msg">sharpening the regret pencil...</div>
      <div class="loading-bars">
        <span></span><span></span><span></span><span></span><span></span>
      </div>
    </section>

    <section id="receipt-wrap" class="receipt-wrap" hidden>
      <div id="receipt" class="receipt"></div>
      <div id="share" class="share-row" style="display:none">
        <button onclick="share()" class="share-btn">SHARE YOUR AUDIT</button>
        <button id="redo-btn" type="button" class="redo-btn">FILE ANOTHER DECLARATION</button>
      </div>
    </section>
  </main>
</body>
</html>
