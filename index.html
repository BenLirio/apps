<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b0c10" media="(prefers-color-scheme: dark)">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-DZ37BB6T3L"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-DZ37BB6T3L');
  </script>
  <title>Entertainment Factory — apps</title>
  <meta property="og:title" content="Entertainment Factory">
  <meta property="og:description" content="Tiny entertainment web apps. Ideas, prototypes, published.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://benlirio.com/apps/">
  <link rel="stylesheet" href="style.css">
  <script src="feedback.js" defer></script>
</head>
<body data-endpoint="https://5c99bazuj0.execute-api.us-east-1.amazonaws.com/idea-action" data-spawn-endpoint="https://5c99bazuj0.execute-api.us-east-1.amazonaws.com/spawn">
  <header class="site-header">
    <div class="brand">
      <h1>Entertainment Factory</h1>
      <p class="tagline">112 tiny apps in the pipeline</p>
    </div>
  </header>

  <div class="controls">
    <div class="controls-inner">
      <nav class="tabs" role="tablist" aria-label="Filter by stage">
        <button class="tab" data-stage="idea" role="tab" aria-selected="false">
          <span class="tab-label">Ideas</span>
          <span class="tab-count">11</span>
        </button>
        <button class="tab is-active" data-stage="prototype" role="tab" aria-selected="true">
          <span class="tab-label">Prototypes</span>
          <span class="tab-count">32</span>
        </button>
        <button class="tab" data-stage="published" role="tab" aria-selected="false">
          <span class="tab-label">Published</span>
          <span class="tab-count">2</span>
        </button>
        <button class="tab" data-stage="archived" role="tab" aria-selected="false">
          <span class="tab-label">Archived</span>
          <span class="tab-count">67</span>
        </button>
      </nav>
      <div id="ideas-actions" class="ideas-actions" hidden>
        <button id="new-idea-btn" class="btn-new-idea" type="button" aria-label="Generate a new idea">
          <span aria-hidden="true">+</span> New Idea
        </button>
      </div>
      <div class="search-row">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="search" type="search" placeholder="Search by name or pitch…" autocomplete="off" aria-label="Search apps">
        <span id="visible-count" class="visible-count" aria-live="polite"></span>
      </div>
    </div>
  </div>

  <main>
    
    <div id="grid" class="grid"></div>
    <p id="empty" class="empty" hidden>No apps in this stage yet.</p>
  </main>

  <footer>
    <p>built by <a href="https://benlirio.com/">ben lirio</a> · source on <a href="https://github.com/BenLirio/entertainment-factory">github</a></p>
  </footer>

  <script src="apps.js" defer></script>
</body>
</html>
