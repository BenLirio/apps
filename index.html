<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entertainment Factory — apps</title>
  <meta property="og:title" content="Entertainment Factory">
  <meta property="og:description" content="Tiny entertainment web apps. Ideas → prototypes → published. Archive what doesn't work.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://benlirio.com/apps/">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="feedback.js" defer></script>
</head>
<body data-endpoint="https://5c99bazuj0.execute-api.us-east-1.amazonaws.com/idea-action">
  <header>
    <div class="crt">
      <h1>ENTERTAINMENT FACTORY</h1>
      <p class="sub">97 apps in the pipeline</p>
    </div>
    <nav class="tabs" role="tablist">
      <button class="tab" data-stage="idea"      role="tab" aria-selected="false">IDEAS <span class="count">5</span></button>
      <button class="tab is-active" data-stage="prototype" role="tab" aria-selected="true">PROTOTYPES <span class="count">30</span></button>
      <button class="tab" data-stage="published" role="tab" aria-selected="false">PUBLISHED <span class="count">0</span></button>
      <button class="tab" data-stage="archived"  role="tab" aria-selected="false">ARCHIVED <span class="count">62</span></button>
    </nav>
    <div class="search-row">
      <input id="search" type="search" placeholder="search by name, mechanic, category…" autocomplete="off">
      <span id="visible-count" class="visible-count" aria-live="polite"></span>
    </div>
  </header>
  <main>
    
    <div id="grid" class="grid"></div>
    <p id="empty" class="empty" hidden>No apps in this stage yet.</p>
  </main>
  <footer>
    <p>built by <a href="https://benlirio.com/">ben lirio</a> &middot; source on <a href="https://github.com/BenLirio/entertainment-factory">github</a></p>
  </footer>
  <script src="apps.js" defer></script>
</body>
</html>
